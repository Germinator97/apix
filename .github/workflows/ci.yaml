name: CI

# develop only. master receives nothing but release merges of develop, whose
# tree is byte-identical to the one develop's run just tested — running on both
# tested every release twice. RELEASING.md checks that identity before tagging.
#
# And once a week, because the unpinned jobs below exist to notice the world
# moving, and without a push nothing ran: flutter_secure_storage 11.0.0 shipped
# on 2026-08-06, and pub.dev's score dropped to 150/160 on it long before any
# run here could see it.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  # A scheduled run starts from the default branch, master. Point every checkout
  # of this package at develop instead, where the next release is being made.
  SOURCE_REF: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}

jobs:
  analyze:
    # Matrix over the declared dio range (see pubspec `dio: ">=5.4.0 <7.0.0"`).
    # `floor` catches referencing a dio symbol that only exists in a newer
    # release; `latest` catches a non-exhaustive switch when dio adds an enum
    # value. pubspec.lock is not committed, so CI resolves fresh every run —
    # this matrix pins the bounds we actually promise to support.
    name: Analyze (dio ${{ matrix.dio }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dio: [floor, latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Pin dio to floor
        if: matrix.dio == 'floor'
        run: flutter pub downgrade dio

      - name: Analyze
        run: dart analyze --fatal-infos lib test example

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test example

  test:
    name: Test (dio ${{ matrix.dio }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dio: [floor, latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Pin dio to floor
        if: matrix.dio == 'floor'
        run: flutter pub downgrade dio

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage
        if: matrix.dio == 'latest'
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  # The second declared range, and the one the dio matrix above cannot see.
  #
  # `flutter_secure_storage: ">=10.0.0 <12.0.0"` is not a passive dependency:
  # SecureStorageService decides whether to delete a user's credentials from the
  # message its Android side produces, and that side does not behave the same
  # across the range — where the plugin assigns its `preferences` field moved
  # inside the success callback between 10.2.0 and 10.3.1, the per-store option
  # freeze starts at 10.2.0, and 11.2.0 scopes deleteAll to the key prefix. A
  # release about that behaviour shipped without a guard on both bounds is the
  # drift this file exists to catch. The floor is this job; the ceiling is
  # `plugin-latest` below.
  #
  # A job rather than a second matrix axis: adding a key renames every existing
  # cell, and the required checks are named after them.
  plugin-floor:
    name: Plugin floor (flutter_secure_storage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Pin flutter_secure_storage to floor
        run: flutter pub downgrade flutter_secure_storage

      # Prove the pin took before concluding anything from a green run: a
      # downgrade that silently resolved to the same version would make this
      # job a second copy of `latest`, green and measuring nothing.
      #
      # The expected value is derived from the declared constraint rather than
      # written here — a floor spelled out in this file goes stale the day the
      # pubspec raises it, and a stale expectation fails a healthy repo.
      - name: Prove the floor is what pubspec declares
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import re, sys

          spec = open('pubspec.yaml').read()
          lock = open('pubspec.lock').read()

          floor = re.search(
              r'flutter_secure_storage:\s*["\']>=([0-9][0-9.]*)', spec)
          if not floor:
              sys.exit('no ">=x.y.z" floor for flutter_secure_storage in '
                       'pubspec.yaml — this parsing is stale, not the pubspec')

          got = re.search(
              r'^  flutter_secure_storage:\n(?:.*\n)*?    version: "([^"]+)"',
              lock, re.M)
          if not got:
              sys.exit('flutter_secure_storage absent from pubspec.lock — '
                       'the downgrade did not run')

          print(f'declared floor {floor.group(1)} · resolved {got.group(1)}')
          if got.group(1) != floor.group(1):
              sys.exit('the downgrade did not reach the declared floor, so '
                       'this job is a second copy of `latest`')
          EOF

      - name: Analyze
        run: dart analyze --fatal-infos lib test example

      - name: Run tests
        run: flutter test

  # The ceiling of the same range. The Test jobs pin Flutter 3.24.0, where pub
  # resolves flutter_secure_storage 10.x: 11 needs Flutter 3.38, its windows
  # implementation depending on win32 6. So only a job on today's stable
  # reaches the major the range was widened for — and only on a fresh
  # resolution: a lock kept from an older SDK stays on 10.x without a word,
  # which is exactly what a local run did before this job existed.
  plugin-latest:
    name: Plugin latest (flutter_secure_storage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Prove the resolution reached the top of the range before concluding
      # anything from a green run: otherwise this job is a copy of the Test
      # jobs, green and measuring nothing. The expected major is derived from
      # the declared ceiling (`<12.0.0` → 11), never written here.
      - name: Prove the latest major is what pubspec allows
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import re, sys

          spec = open('pubspec.yaml').read()
          lock = open('pubspec.lock').read()

          ceiling = re.search(
              r'flutter_secure_storage:\s*["\'][^"\']*<([0-9]+)\.0\.0', spec)
          if not ceiling:
              sys.exit('no "<N.0.0" ceiling for flutter_secure_storage in '
                       'pubspec.yaml — this parsing is stale, not the pubspec')

          got = re.search(
              r'^  flutter_secure_storage:\n(?:.*\n)*?    version: "([^"]+)"',
              lock, re.M)
          if not got:
              sys.exit('flutter_secure_storage absent from pubspec.lock')

          expected = int(ceiling.group(1)) - 1
          major = int(got.group(1).split('.')[0])
          print(f'declared ceiling <{ceiling.group(1)}.0.0 · resolved '
                f'{got.group(1)}')
          if major != expected:
              sys.exit(f'resolved major {major} where the range reaches '
                       f'{expected}: this job is testing an older plugin '
                       f'than the one it exists for')
          EOF

      - name: Run tests
        run: flutter test

  # Builds the demo app, which depends on this package through `path: ../apix`.
  #
  # It had never run here. A relative path dependency resolves on a developer's
  # machine because the sibling is always there, so the one layout that matters
  # is the one never exercised: a runner clones only the repo that triggered the
  # run, and `../apix` does not exist. The two checkouts below reproduce the
  # side-by-side layout on purpose, and the demo has to be built rather than
  # merely analysed — only a build runs the shrinker and the plugin wiring.
  example-app:
    name: Example app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout apix
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}
          path: apix

      - name: Checkout the example app
        uses: actions/checkout@v5
        with:
          repository: Germinator97/apix_example_app
          ref: develop
          path: apix_example_app

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: apix_example_app
        run: flutter pub get

      - name: Analyze
        working-directory: apix_example_app
        run: flutter analyze

      - name: Test
        working-directory: apix_example_app
        run: flutter test

      # Release, not debug: only the published mode runs R8, so only it can
      # fail on a missing shrinking rule — and if nothing builds it, that
      # failure waits for the release.
      - name: Build release APK
        working-directory: apix_example_app
        run: flutter build apk --release

  # The device probes of the demo app, on an Android 11 (API 30) emulator, at
  # both ends of the plugin range. Every job above runs against a mocked
  # flutter_secure_storage, which proves apix's logic and never its premise:
  # which exception the platform raises, where a write lands, whether a store
  # can be deleted at all. Those were only ever measured by hand, and the
  # measurements kept correcting the documentation — the last run, the day this
  # job was written, found the biometric refusal wrapped from the first call
  # where the docs said bare. A job, not a manual step before a release.
  #
  # The probes run with Sentry active, as every run of the demo does: an event
  # that stops reaching the tracker looks exactly like one that does, unless it
  # is sent. So the job needs the SENTRY_DSN secret, and says so if it is gone.
  device-probes:
    name: Device probes (flutter_secure_storage ${{ matrix.plugin }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor, on the SDK the demo pins.
          - plugin: floor
            flutter-version: '3.32.0'
          # The ceiling needs today's stable: 11.x resolves from Flutter 3.38.
          - plugin: latest
            flutter-version: ''
    steps:
      - name: Require the Sentry DSN
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [ -z "$SENTRY_DSN" ]; then
            echo "::error::No SENTRY_DSN secret: the probes run with Sentry active. Add it with: gh secret set SENTRY_DSN -R Germinator97/apix"
            exit 1
          fi

      - name: Checkout apix
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}
          path: apix

      - name: Checkout the example app
        uses: actions/checkout@v5
        with:
          repository: Germinator97/apix_example_app
          ref: develop
          path: apix_example_app

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: 'stable'
          cache: true

      - name: Resolve the plugin at its ${{ matrix.plugin }}
        working-directory: apix_example_app
        run: |
          flutter pub get
          if [ "${{ matrix.plugin }}" = floor ]; then
            flutter pub downgrade flutter_secure_storage
          else
            flutter pub upgrade
          fi

      # As in plugin-floor and plugin-latest: prove the bound before trusting
      # a green run, both ends derived from apix's declared range.
      - name: Prove the resolved plugin is the ${{ matrix.plugin }}
        env:
          BOUND: ${{ matrix.plugin }}
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import os, re, sys

          spec = open('apix/pubspec.yaml').read()
          lock = open('apix_example_app/pubspec.lock').read()

          declared = re.search(
              r'flutter_secure_storage:\s*["\']>=([0-9][0-9.]*)\s*<([0-9]+)\.0\.0',
              spec)
          if not declared:
              sys.exit('no ">=x.y.z <N.0.0" range for flutter_secure_storage '
                       'in apix/pubspec.yaml — this parsing is stale')
          got = re.search(
              r'^  flutter_secure_storage:\n(?:.*\n)*?    version: "([^"]+)"',
              lock, re.M)
          if not got:
              sys.exit('flutter_secure_storage absent from the demo lock')

          floor, ceiling = declared.group(1), int(declared.group(2))
          version = got.group(1)
          print(f'declared >={floor} <{ceiling}.0.0 · resolved {version}')
          if os.environ['BOUND'] == 'floor' and version != floor:
              sys.exit('the downgrade did not reach the declared floor')
          if (os.environ['BOUND'] == 'latest'
                  and int(version.split('.')[0]) != ceiling - 1):
              sys.exit('the upgrade did not reach the top major of the range')
          EOF

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the probes on an API 30 emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: apix_example_app
          script: flutter test integration_test -d emulator-5554 --dart-define=SENTRY_DSN=$SENTRY_DSN

  # Catches what `dart analyze` cannot: anything that would make the package
  # unpublishable, and the pub.dev score the next release will actually get.
  publishable:
    name: Publishable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Publish dry run
        run: dart pub publish --dry-run

      # pana converts the pubspec screenshots with the WebP tools. pub.dev's
      # analysis has them, a bare runner does not, and without them the
      # screenshots score 0/10 ("tool not found", then "No such file or
      # directory"). Each tool is checked by name, so a missing one fails here
      # rather than as a lost point.
      - name: Install the WebP tools pana converts screenshots with
        run: |
          sudo apt-get update
          sudo apt-get install -y webp
          for tool in webpinfo cwebp gif2webp; do command -v "$tool"; done

      # Any lost point fails the job. The threshold was 20, and it hid two
      # losses at once: the ten points flutter_secure_storage 11 cost on pub.dev
      # (150/160), and the ten the runner lost on its own for want of the WebP
      # tools. With the tools the job scores what pub.dev scores — 160 for
      # develop, measured locally with pana 0.23.19 — so there is no noise left
      # to absorb.
      - name: Score with pana
        run: |
          dart pub global activate pana
          dart pub global run pana --no-warning --exit-code-threshold 0 .
