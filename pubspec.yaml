name: apix

description: "Production-ready Flutter/Dart API client with auth refresh queue, exponential retry, smart caching and error tracking (Sentry-ready). Powered by Dio."

version: 5.0.0

homepage: https://github.com/Germinator97/apix

repository: https://github.com/Germinator97/apix

issue_tracker: https://github.com/Germinator97/apix/issues

# Shown as a gallery on the pub.dev package page, separately from the README.
screenshots:
  - description: "The example app: requests, responses and caching filed under one taxonomy, with live request metrics in the status bar."
    path: assets/screenshots/home.png
  - description: "A probe reporting its evidence rather than a tick: two accounts on one device are served their own cache entry. Auth, upload and error-code demos below."
    path: assets/screenshots/probes.png
  - description: "Method-aware retry counted attempt by attempt, plus what reaches the error tracker and what is dropped as transport noise."
    path: assets/screenshots/demos.png

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ">=5.4.0 <7.0.0"
  crypto: ">=3.0.0 <4.0.0"
  sentry_flutter: ">=9.0.0 <10.0.0"
  flutter_secure_storage: ">=10.0.0 <11.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.0
